<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maya connection check</title><style>body{font:18px system-ui;background:#eee8ff;color:#271949;margin:24px;overflow-wrap:anywhere}button{font:inherit;padding:12px;border-radius:12px}pre{white-space:pre-wrap}</style><h1>মায়ার সংযোগ পরীক্ষা</h1><p>এই পরীক্ষা প্রশ্ন, জন্মতথ্য বা লগইন token পাঠায় না।</p><button id="run">সার্ভারের সংযোগ পরীক্ষা করুন</button><pre id="out"></pre><a href="/#/chat">চ্যাটে ফিরুন</a><script>
const endpoint="http://localhost:3001/api/maya/request";
document.querySelector('#run').onclick=async()=>{
const out=document.querySelector('#out');out.textContent='Origin: '+location.origin+'\nপরীক্ষা চলছে…';
try{const response=await fetch(endpoint,{method:'POST',credentials:'omit',cache:'no-store',redirect:'error',headers:{'Content-Type':'application/json','Authorization':'Bearer maya-connection-probe'},body:'{}',signal:AbortSignal.timeout(15000)});out.textContent='Origin: '+location.origin+'\nHTTP: '+response.status+'\nব্রাউজার থেকে সার্ভারে সংযোগ হয়েছে। এই পরীক্ষায় আসল login token দেওয়া হয়নি; তাই 401/403 স্বাভাবিক। চ্যাট এখনও ব্যর্থ হলে login, account permission, জন্মছক প্রস্তুতি ও provider আলাদা করে যাচাই করতে হবে।'}catch(error){out.textContent='Origin: '+location.origin+'\nError: '+error.name+'\nব্রাউজার থেকে Gateway পৌঁছানো যায়নি। Termux রিপোর্টে Gateway/CORS ফল দেখুন।'}
};</script></html>
