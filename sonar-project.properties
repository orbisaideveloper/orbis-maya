sonar.projectKey=orbisaideveloper_orbis-maya
sonar.organization=orbis
sonar.projectName=orbis-maya
sonar.sourceEncoding=UTF-8

# Analyse the repository from day one. Application/test paths are refined when
# the scaffold is introduced; tooling/docs remain quality-scanned where useful.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/quality-reports/**,**/playwright-report/**,**/test-results/**,**/.git/**,**/.scannerwork/**,**/.orbis-backup/**,**/*.test.*,**/*.spec.*

# Tooling/governance is scanned for issues but is not production runtime code.
sonar.coverage.exclusions=scripts/**,.github/**,docs/**,**/*.md,**/*.d.ts,**/vite.config.*,**/vitest.config.*,**/playwright.config.*,eslint.config.*,oxlint.json

# Runtime duplication target is 0.00%; tooling/config boilerplate is excluded
# from CPD while still remaining visible to normal quality/security analysis.
sonar.cpd.exclusions=scripts/**,.github/**,docs/**,**/*.md,**/*.d.ts

# Becomes active as soon as the application coverage harness writes LCOV.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
