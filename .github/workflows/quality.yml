name: ORBIS Maya Quality Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbis-maya-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, Sonar & Safety
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Repository quality preflight
        run: bash scripts/quality-preflight.sh
      - name: Detect application scaffold
        id: app
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s package.json && -s package-lock.json ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'Application scaffold detected.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Governance-only baseline.'
          fi
      - name: Install dependencies
        if: steps.app.outputs.present == 'true'
        run: npm ci --ignore-scripts --no-fund
      - name: Dependency audit
        if: steps.app.outputs.present == 'true'
        run: npm audit --audit-level=high
      - name: Lint — zero warnings/errors
        if: steps.app.outputs.present == 'true'
        run: npm run lint
      - name: TypeScript — zero errors
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck
      - name: Tests and coverage
        if: steps.app.outputs.present == 'true'
        run: npm run test:coverage
      - name: Verify 100 percent production coverage
        if: steps.app.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/coverage-summary.json
          test -s coverage/lcov.info
          node <<'NODE'
          const fs=require('fs');const s=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));const r=['lines','statements','functions','branches'];const f=r.filter((m)=>Number(s.total?.[m]?.pct)!==100);if(f.length){for(const m of f)console.error(`${m}: ${s.total?.[m]?.pct??'missing'}% (required 100%)`);process.exit(1)}console.log('Coverage gate: PASS — 100%')
          NODE
      - name: Dead-code guard
        if: steps.app.outputs.present == 'true'
        run: npm run quality:knip
      - name: Duplication guard
        if: steps.app.outputs.present == 'true'
        run: npm run quality:jscpd
      - name: Production PWA build
        if: steps.app.outputs.present == 'true'
        run: npm run build:pwa
      - name: Verify PWA build artifacts
        if: steps.app.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/registerSW.js
          test -s dist/sw.js
          echo 'PWA build artifacts: PASS'
      - name: Install Playwright Chromium
        if: steps.app.outputs.present == 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Mobile E2E
        if: steps.app.outputs.present == 'true'
        run: npm run test:e2e
      - name: Require Sonar token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SONAR_TOKEN:-}" || { echo 'ERROR: SONAR_TOKEN is missing.'; exit 1; }
          echo 'SONAR_TOKEN: configured (value hidden)'
      - name: SonarQube Cloud scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Strict Sonar verification
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: node scripts/sonar-strict-gate.mjs
      - name: Governance-only result
        if: steps.app.outputs.present == 'false'
        run: |
          echo 'ORBIS Maya governance-only quality foundation: PASS'
          echo 'Application gates activate when package.json and package-lock.json exist.'
